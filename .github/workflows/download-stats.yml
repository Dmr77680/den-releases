name: Download stats

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous total
        uses: actions/cache/restore@v4
        with:
          path: last_total.txt
          key: stats-never-matches
          restore-keys: |
            stats-

      - name: Count downloads and notify
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK: ${{ secrets.DISCORD_STATS_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "Secret DISCORD_STATS_WEBHOOK is missing"
            exit 1
          fi
          rows=$(gh api "repos/$REPO/releases" --paginate \
            --jq '.[] | .tag_name as $t | .assets[] | select(.name | endswith(".apk")) | "\($t) \(.download_count)"')
          total=$(printf '%s\n' "$rows" | awk 'NF{s+=$2} END{print s+0}')
          latest=$(printf '%s\n' "$rows" | awk 'NF{print; exit}')
          tag=${latest%% *}
          count=${latest##* }
          prev=""
          if [ -f last_total.txt ]; then
            prev=$(cat last_total.txt)
          fi
          echo "total=$total previous=${prev:-none}"
          msg=""
          if [ -z "$prev" ]; then
            msg="📊 Suivi des téléchargements de DEN activé. Total actuel : $total"
          elif [ "$total" -gt "$prev" ]; then
            diff=$((total - prev))
            msg="📥 DEN : +$diff téléchargement(s) — total $total (dernière version $tag : $count)"
          fi
          if [ -n "$msg" ]; then
            payload=$(jq -n --arg c "$msg" '{content: $c}')
            curl -fsS -H "Content-Type: application/json" -d "$payload" "$HOOK" > /dev/null
          fi
          echo "$total" > last_total.txt

      - name: Save total
        uses: actions/cache/save@v4
        with:
          path: last_total.txt
          key: stats-${{ github.run_id }}
