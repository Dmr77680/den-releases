name: Log bot

on:
  push:
    paths:
      - '.github/workflows/log-bot.yml'
      - 'logbot/**'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: log-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Get the bot code
        uses: actions/checkout@v4

      - name: Answer logs posted on Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LOG_CHANNEL_IDS: ${{ secrets.LOG_CHANNEL_IDS }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${LOG_CHANNEL_IDS:-}" ]; then
            echo "Secrets DISCORD_BOT_TOKEN and LOG_CHANNEL_IDS are required"
            exit 1
          fi
          cd logbot
          python3 poll.py
          gh workflow run log-bot.yml --repo "$GITHUB_REPOSITORY" || echo "Relaunch failed, the schedule will take over"
